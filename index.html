<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Dusk Fundgrove - AI-Assisted Trading Platform | Australia</title>
    <meta
      name="description"
      content="Dusk Fundgrove runs your trading desk through the night with AI signals, bank-grade custody and 24/7 human support. Create your free account today."
    />
    <meta
      name="keywords"
      content="Dusk Fundgrove, AI trading platform, crypto trading Australia, buy Bitcoin Australia, Ethereum trading, overnight trading, evening trading desk"
    />
    <meta name="theme-color" content="#faf6ec" />

    <!-- Open Graph / Twitter (defaults; per-route values are set via useMeta) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dusk Fundgrove" />
    <meta property="og:title" content="Dusk Fundgrove - AI-Assisted Trading Platform" />
    <meta
      property="og:description"
      content="Dusk Fundgrove runs your trading desk through the night with AI signals, bank-grade custody and 24/7 human support. Create your free account today."
    />
    <meta property="og:url" content="https://dusk-fundgrove-platform.com/" />
    <meta property="og:image" content="https://dusk-fundgrove-platform.com/og-image-v4.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dusk Fundgrove - AI-Assisted Trading Platform" />
    <meta
      name="twitter:description"
      content="Dusk Fundgrove runs your trading desk through the night with AI signals, bank-grade custody and 24/7 human support. Create your free account today."
    />
    <meta name="twitter:image" content="https://dusk-fundgrove-platform.com/og-image-v4.png" />

    <!-- Fonts: Public Sans (headings and body) + Roboto
         Mono (data numerals) - evening ledger print aesthetic.
         Static instances instead of the full variable axes - variable
         files are heavy and slow LCP. Loaded non-blocking so the
         stylesheet doesn't delay first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=optional: no font swap after first paint, so no CLS.
         The preloaded stylesheet makes the fonts available early on
         normal connections; slow connections get the Georgia fallback. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=optional"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=optional"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
