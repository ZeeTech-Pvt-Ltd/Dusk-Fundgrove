<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Dusk Fundgrove - AI-Powered Trading Platform | Australia</title>
    <meta
      name="description"
      content="Dusk Fundgrove is an AI-powered trading platform for Bitcoin, Ethereum and 300+ assets. Create your free account today and trade around the clock."

      name="keywords"
      content="Dusk Fundgrove, AI trading platform, crypto trading Australia, buy Bitcoin Australia, Ethereum trading, cryptocurrency exchange Australia, night trading"
    />
    <meta name="theme-color" content="#0a0f18" />

    <!-- Open Graph / Twitter (defaults; per-route values are set via useMeta) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dusk Fundgrove" />
    <meta property="og:title" content="Dusk Fundgrove - AI-Powered Trading Platform" />
    <meta
      property="og:description"
      content="Dusk Fundgrove is an AI-powered trading platform for Bitcoin, Ethereum and 300+ assets. Create your free account today and trade around the clock."
    />
    <meta property="og:url" content="https://dusk-fundgrove-platform.com/" />
    <meta property="og:image" content="https://dusk-fundgrove-platform.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dusk Fundgrove - AI-Powered Trading Platform" />
    <meta
      name="twitter:description"
      content="Dusk Fundgrove is an AI-powered trading platform for Bitcoin, Ethereum and 300+ assets. Create your free account today and trade around the clock."

    <!-- Fonts: Bricolage Grotesque (display) + Inter (body) + Chivo Mono
         (data numerals) - night desk terminal.
         Static instances instead of the full variable axes - variable
         files are heavy and slow LCP. Loaded non-blocking so the
         stylesheet doesn't delay first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=optional: no font swap after first paint, so no CLS.
         The preloaded stylesheet makes the fonts available early on
         normal connections; slow connections get the Arial fallback. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&family=Chivo+Mono:wght@500;600;700&display=optional"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&family=Chivo+Mono:wght@500;600;700&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&family=Chivo+Mono:wght@500;600;700&display=optional"
      />
    </noscript>

          }
        ]
      }
    </script>
  </head>
