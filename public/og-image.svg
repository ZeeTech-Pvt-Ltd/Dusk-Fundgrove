<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="duskDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e08a3c"/>
      <stop offset="0.55" stop-color="#d2556e"/>
      <stop offset="1" stop-color="#7a5fd0"/>
    </linearGradient>
    <linearGradient id="duskText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e08a3c"/>
      <stop offset="0.5" stop-color="#d2556e"/>
      <stop offset="1" stop-color="#7a5fd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.08" r="0.6">
      <stop offset="0" stop-color="#e08a3c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#faf6ec" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#faf6ec"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- horizon line -->
  <line x1="0" y1="330" x2="1200" y2="330" stroke="#cdc2a8" stroke-width="2"/>

  <!-- setting sun, cropped by the right edge so it stays clear of the headline -->
  <path d="M1000 330 A 150 150 0 0 1 1300 330 Z" fill="url(#duskDisc)" opacity="0.9"/>
  <g stroke="#e08a3c" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="1120" y1="352" x2="1120" y2="380"/>
    <line x1="1180" y1="356" x2="1180" y2="394"/>
  </g>
  <g stroke="#201c2b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M760 200 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M820 172 q7 -7 14 0 q7 -7 14 0"/>
  </g>

  <!-- candlestick silhouettes along the bottom -->
  <g stroke="#201c2b" stroke-width="4">
    <line x1="80" y1="560" x2="80" y2="430"/>
    <line x1="160" y1="580" x2="160" y2="390"/>
    <line x1="240" y1="545" x2="240" y2="355"/>
    <line x1="320" y1="575" x2="320" y2="330"/>
  </g>
  <g fill="#201c2b">
    <rect x="66" y="436" width="28" height="120" rx="4"/>
    <rect x="146" y="396" width="28" height="180" rx="4"/>
    <rect x="226" y="361" width="28" height="180" rx="4"/>
    <rect x="306" y="336" width="28" height="235" rx="4"/>
  </g>
  <g stroke="#b93a2d" stroke-width="4">
    <line x1="400" y1="540" x2="400" y2="300"/>
    <line x1="480" y1="515" x2="480" y2="265"/>
  </g>
  <g fill="#b93a2d">
    <rect x="386" y="306" width="28" height="230" rx="4"/>
    <rect x="466" y="271" width="28" height="240" rx="4"/>
  </g>

  <!-- rising line -->
  <path d="M60 500 C 200 470, 320 360, 460 300 S 620 200, 700 175"
        fill="none" stroke="#7a5fd0" stroke-width="5" stroke-linecap="round"/>
  <g fill="#7a5fd0" stroke="#faf6ec" stroke-width="4">
    <rect x="446" y="286" width="28" height="28" rx="5"/>
    <rect x="686" y="161" width="28" height="28" rx="5"/>
  </g>

  <!-- brand block -->
  <g transform="translate(80 60)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#fffdf6" stroke="#cdc2a8" stroke-width="3"/>
    <line x1="10" y1="44" x2="54" y2="44" stroke="#201c2b" stroke-width="2.5"/>
    <path d="M14 44 A 18 18 0 0 1 50 44 Z" fill="url(#duskDisc)"/>
    <line x1="14" y1="26" x2="14" y2="18" stroke="#e08a3c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="14" x2="32" y2="8" stroke="#d2556e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="26" x2="50" y2="18" stroke="#7a5fd0" stroke-width="2.5" stroke-linecap="round"/>
    <text x="88" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="52" fill="#201c2b">Dusk Fundgrove</text>
  </g>

  <text x="80" y="292" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="62" fill="url(#duskText)">When The Markets Quiet Down,</text>
  <text x="80" y="378" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="62" fill="#201c2b">We Keep On Trading.</text>

  <text x="80" y="470" font-family="Arial, sans-serif" font-size="26" fill="#6d6679">Bitcoin · Ethereum · 300+ markets · 256-bit encryption, 98% cold storage.</text>

  <rect x="80" y="508" width="300" height="12" rx="6" fill="url(#duskText)"/>
  <rect x="400" y="508" width="140" height="12" rx="6" fill="#b93a2d"/>
</svg>
