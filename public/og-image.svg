<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="duskDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e08a3c"/>
      <stop offset="0.55" stop-color="#d2556e"/>
      <stop offset="1" stop-color="#7a5fd0"/>
    </linearGradient>
    <linearGradient id="duskText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e08a3c"/>
      <stop offset="0.5" stop-color="#d2556e"/>
      <stop offset="1" stop-color="#7a5fd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#e08a3c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#faf6ec" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#faf6ec"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand block: logo mark + wordmark -->
  <g transform="translate(80 92)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#fffdf6" stroke="#cdc2a8" stroke-width="3"/>
    <line x1="12" y1="50" x2="60" y2="50" stroke="#201c2b" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 50 A 20 20 0 0 1 56 50 Z" fill="url(#duskDisc)"/>
    <line x1="16" y1="28" x2="16" y2="18" stroke="#e08a3c" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="15" x2="36" y2="8" stroke="#d2556e" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="28" x2="56" y2="18" stroke="#7a5fd0" stroke-width="3" stroke-linecap="round"/>
    <text x="96" y="55" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="58" fill="#201c2b">Dusk Fundgrove</text>
  </g>

  <!-- headline -->
  <text x="80" y="330" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="64" fill="url(#duskText)">When The Markets Quiet Down,</text>
  <text x="80" y="416" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="64" fill="#201c2b">We Keep On Trading.</text>

  <!-- subline -->
  <text x="80" y="492" font-family="Arial, sans-serif" font-size="25" fill="#6d6679">Bitcoin · Ethereum · 300+ markets · 256-bit encryption, 98% cold storage.</text>

  <!-- accent bars -->
  <rect x="80" y="534" width="300" height="10" rx="5" fill="url(#duskText)"/>
  <rect x="400" y="534" width="120" height="10" rx="5" fill="#b93a2d"/>
</svg>
